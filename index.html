<style>
  :root{
    --mostaza:#E9A800; --azul-claro:#6FC2D8; --azul-oscuro:#2350A0; --fondo:#EEF5FF;
    --rojo:#E05353; --verde:#3FAE6B; --gris:#8A93A6; --texto:#1E2A3A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--texto);}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-weight:600;transition:.15s;}
  button:active{transform:scale(.97);}
  input,select,textarea{font-family:inherit;border:2px solid #D8E3F5;border-radius:10px;padding:10px 12px;font-size:15px;width:100%;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul-claro);}
  .btn-primary{background:var(--mostaza);color:#fff;}
  .btn-secondary{background:var(--azul-claro);color:#fff;}
  .btn-dark{background:var(--azul-oscuro);color:#fff;}
  .btn-ghost{background:#fff;color:var(--azul-oscuro);border:2px solid #D8E3F5;}
  .btn-danger{background:var(--rojo);color:#fff;}
  .card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(35,80,160,.08);}
  .container{max-width:1100px;margin:0 auto;padding:16px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .col{flex:1;min-width:220px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
  .badge-ok{background:#E4F7EC;color:var(--verde);}
  .badge-warn{background:#FFF3D6;color:var(--mostaza);}
  .badge-bad{background:#FCE7E7;color:var(--rojo);}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
  .tab{padding:9px 16px;border-radius:999px;background:#fff;color:var(--azul-oscuro);font-weight:600;white-space:nowrap;font-size:14px;}
  .tab.active{background:var(--azul-oscuro);color:#fff;}
  .topbar{background:var(--azul-oscuro);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
  .modal-bg{position:fixed;inset:0;background:rgba(30,42,58,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:16px;padding:20px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #EEF2F8;}
  th{color:var(--gris);font-size:12px;text-transform:uppercase;}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40;}
  .confetti span{position:absolute;top:-20px;font-size:22px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.3;}}
  .birthday-banner{background:linear-gradient(135deg,var(--mostaza),#F5C542);color:#fff;border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;}
  a{color:var(--azul-oscuro);}
  .loader{width:34px;height:34px;border:4px solid #D8E3F5;border-top-color:var(--azul-oscuro);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err{color:var(--rojo);font-size:14px;margin:4px 0;}
  .ok{color:var(--verde);font-size:14px;margin:4px 0;}
  .empty{text-align:center;color:var(--gris);padding:30px 10px;}
</style>

// Cuota combinada: si un alumno tiene 2 o más clases, se suman las cuotas
// y se aplica un 5% de descuento sobre el total (política de la academia).
const MULTI_CLASS_DISCOUNT = 0.05;
function computeTotalFee(fees){
  const sum = fees.reduce((s,f)=>s+(f||0),0);
  if(fees.length>=2) return Math.round(sum*(1-MULTI_CLASS_DISCOUNT)*100)/100;
  return sum;
}
// Descuentos por pago adelantado (trimestral/anual)
const PLAN_MONTHS = {monthly:1, quarterly:3, annual:10}; // anual = curso completo, sept-junio
const PLAN_DISCOUNT = {monthly:0, quarterly:0.05, annual:0.07};
function computePlanTotal(monthlyFee, planType){
  const months = PLAN_MONTHS[planType]||1;
  const discount = PLAN_DISCOUNT[planType]||0;
  return Math.round(monthlyFee*months*(1-discount)*100)/100;
}
function monthsCoveredFrom(year,month,count){
  const list=[];
  let y=year, m=month;
  for(let i=0;i<count;i++){
    list.push({year:y,month:m});
    m++; if(m>12){ m=1; y++; }
  }
  return list;
}
function classColor(name){
  if(!name) return "#8A93A6";
  if(name.includes("Aerograf")) return "#E9A800"; // amarillo
  if(name.includes("Infantil")) return "#6FC2D8"; // azul clarito
  if(name.includes("Juvenil")) return "#4FBF8B"; // verde-azulado (no especificado, asumido)
  if(name.includes("Adultos")) return "#2350A0"; // azul oscuro
  if(name.includes("Acuarela")) return "#9B6FD8"; // morado
  if(name.includes("Textil") || name.includes("Manos Creativas")) return "#F0932B"; // naranja
  return "#8A93A6";
}

}

const NOW = new Date();
const CY = NOW.getFullYear(), CM = NOW.getMonth()+1;
function toLocalISO(d){
  // Fecha en formato YYYY-MM-DD usando la hora LOCAL del dispositivo, sin pasar por UTC
  // (usar toISOString() aquí desplazaría el día en zonas horarias por delante de UTC, como España)
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
const todayISO = toLocalISO(NOW);
const isAugustNow = CM === 8;

function isBirthday(dateStr){
  if(!dateStr) return false;
  const b = new Date(dateStr+"T00:00:00");
  return b.getDate()===NOW.getDate() && b.getMonth()===NOW.getMonth();
}
function ageFromBirthdate(dateStr){
  if(!dateStr) return null;
  const b = new Date(dateStr+"T00:00:00");
  let age = NOW.getFullYear()-b.getFullYear();
  const notYet = (NOW.getMonth()<b.getMonth())||(NOW.getMonth()===b.getMonth()&&NOW.getDate()<b.getDate());
  if(notYet) age--;
  return age;
}

function effectiveRoster(g, profilesArr, extraEnrollments){
  const extra = (profilesArr||[]).filter(p=>p.role==="student" && p.group_id===g.id).map(p=>p.display_name);
  const extra2 = (extraEnrollments||[]).filter(e=>e.group_id===g.id).map(e=>{
    const p = (profilesArr||[]).find(pp=>pp.id===e.student_id);
    return p ? p.display_name : null;
  }).filter(Boolean);
  return [...(g.students||[]), ...extra, ...extra2];
}
function nextOccurrences(dayOfWeek, count=3){
  const dates=[];
  const startFrom = todayISO < COURSE_START ? COURSE_START+"T00:00:00" : NOW.toISOString();
  let d = new Date(startFrom); d.setHours(0,0,0,0);
  for(let i=0;i<200 && dates.length<count;i++){
    const dow = ((d.getDay()+6)%7)+1;
    const ds = toLocalISO(d);
    if(dow===dayOfWeek && isSchoolDay(ds)) dates.push(ds);
    d.setDate(d.getDate()+1);
  }
  return dates;
}
function sessionDateTime(dateStr, timeStr){
  return new Date(dateStr+"T"+timeStr+":00");
}
function hoursUntil(dateStr, timeStr){
  return (sessionDateTime(dateStr,timeStr) - NOW) / 3600000;
}

function WeeklyTimetable({groups, profiles, onSelect, selectedId}){
  const scrollRef = useRef(null);
  function onWheel(e){
    const el = scrollRef.current;
    if(!el) return;
    if(el.scrollWidth > el.clientWidth){
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    }
  }
  const slots = useMemo(()=>{
    const set = new Set(groups.map(g=>g.time_start));
    return Array.from(set).sort();
  },[groups]);
  function cellGroups(day, slot){
    return groups.filter(g=>g.day===day && g.time_start===slot);
  }
  return (
    <div ref={scrollRef} onWheel={onWheel} style={{overflowX:"auto"}}>
      <table style={{minWidth:600}}>
        <thead><tr><th style={{width:60}}>Hora</th>{DNF.map(d=><th key={d}>{d}</th>)}</tr></thead>
        <tbody>
          {slots.map(slot=>(
            <tr key={slot}>
              <td style={{fontWeight:700,color:"var(--azul-oscuro)",whiteSpace:"nowrap"}}>{slot}</td>
              {DNF.map((_,i)=>{
                const day = i+1;
                const cellGs = cellGroups(day,slot);
                return (
                  <td key={day} style={{verticalAlign:"top",minWidth:130}}>
                    {cellGs.map(g=>{
                      const count = g.current_count||0;
                      const cap = capOf(g);
                      const full = count>=cap;
                      const selected = String(selectedId)===String(g.id);
                      const clr = classColor(g.name);
                      const inner = (
                        <div style={{
                          background: selected ? "#FFF3D6" : (full?"#F0F0F0":"#fff"),
                          border:`2px solid ${selected?"var(--mostaza)":clr}`,
                          boxShadow: selected ? "0 0 0 3px rgba(233,168,0,0.25)" : "none",
                          borderRadius:10, padding:"6px 8px", marginBottom:6, opacity: full?0.6:1, position:"relative"
                        }}>
                          {selected && <div style={{position:"absolute",top:-8,right:-8,background:"var(--mostaza)",color:"#fff",borderRadius:"50%",width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:900,boxShadow:"0 1px 4px rgba(0,0,0,.25)"}}>✓</div>}
                          <div style={{fontWeight:700,fontSize:13}}>{g.name}</div>
                          <div style={{fontSize:11,color:clr}}>{g.teacher} · {g.time_start}-{g.time_end}</div>
                          <div style={{fontSize:11,color: full? "var(--rojo)" : "var(--gris)"}}>{full?"Completa":`${count}/${cap} plazas`}</div>
                        </div>
                      );
                      return onSelect
                        ? <div key={g.id} onClick={()=>!full && onSelect(g)} style={{cursor:full?"not-allowed":"pointer"}}>{inner}</div>
                        : <div key={g.id} onClick={()=>onSelect && onSelect(g)}>{inner}</div>;
                    })}
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function RegisterForm({onBack}){
  const [groups,setGroups] = useState(null);
  const [loadErr,setLoadErr] = useState("");
  const [step,setStep] = useState("account"); // account | details | done
  const [err,setErr]=useState(""); const [loading,setLoading]=useState(false);
  const [uid,setUid] = useState(null);
  const [emailDebug,setEmailDebug] = useState(null);
  const [f,setF] = useState({
    display_name:"", email:"", password:"", password2:"", group_id:"", birthdate:"", guardian_name:"", guardian_phone:"",
    guardian_email:"", payment_type:"monthly", preferred_payment_method:"transferencia", privacy_consent:false,
    conditions_accepted:false, conditions_signature:""
  });

  useEffect(()=>{
    sb.from("groups").select("*").order("day").then(({data,error})=>{
      if(error) setLoadErr(error.message);
      setGroups(data||[]);
    });
  },[]);

  function upd(k,v){ setF(prev=>({...prev,[k]:v})); }
  const age = f.birthdate ? ageFromBirthdate(f.birthdate) : null;
  const isMinor = age===null || age < 18;

  async function submitAccount(e){
    e.preventDefault(); setErr("");
    if(f.password.length<6){ setErr("La contraseña debe tener al menos 6 caracteres."); return; }
    if(f.password!==f.password2){ setErr("Las dos contraseñas no coinciden."); return; }
    if(!f.display_name.trim()){ setErr("Indica el nombre completo."); return; }
    if(!f.birthdate){ setErr("Indica la fecha de nacimiento."); return; }

    setLoading(true);
    const { data: signUpData, error: signUpErr } = await sb.auth.signUp({ email: f.email.trim(), password: f.password });
    if(signUpErr){
      setLoading(false);
      setErr(signUpErr.message.includes("already registered") ? "Ese email ya está registrado. Prueba a iniciar sesión." : signUpErr.message);
      return;
    }
    const newUid = signUpData.user?.id;
    if(!newUid){ setLoading(false); setErr("No se pudo crear la cuenta. Inténtalo de nuevo en unos segundos."); return; }

    const { error: profileErr } = await sb.from("profiles").insert({
      id: newUid, role:"student", display_name:f.display_name, birthdate:f.birthdate, email:f.email.trim(),
      student_status:"nuevo", enrollment_month: MN[CM]+" "+CY,
      privacy_consent:false, conditions_accepted:false
    });
    setLoading(false);
    if(profileErr){ setErr("Tu cuenta se creó pero hubo un problema guardando tus datos: "+profileErr.message+". Escríbenos y lo arreglamos."); return; }

    const emailResult = await sendWelcomeEmail(f.email.trim(), f.display_name);
    setEmailDebug(emailResult);
    setUid(newUid);
    setStep("details");
  }

  async function submitDetails(e){
    e.preventDefault(); setErr("");
    if(!f.privacy_consent){ setErr("Tienes que aceptar las condiciones de privacidad para continuar."); return; }
    if(!f.conditions_accepted || !f.conditions_signature.trim()){ setErr("Tienes que leer y firmar las condiciones de la academia para continuar."); return; }
    if(isMinor && !f.guardian_name.trim()){ setErr("Indica el nombre del adulto responsable."); return; }
    if(!f.guardian_phone.trim()){ setErr("Indica un teléfono de contacto."); return; }
    if(!f.group_id){ setErr("Elige una clase."); return; }
    const group = groups.find(g=>String(g.id)===String(f.group_id));
    if(group && group.current_count >= capOf(group)){ setErr("Vaya, esa clase se acaba de completar. Elige otra, por favor."); return; }

    setLoading(true);
    const fee = group.fee;
    const enrollmentFee = isAugustNow ? 0 : STANDARD_ENROLLMENT_FEE;
    const { error: profileErr } = await sb.from("profiles").update({
      group_id:group.id, fee, payment_type:f.payment_type,
      guardian_name: isMinor ? f.guardian_name : null, guardian_phone:f.guardian_phone, guardian_email:f.guardian_email,
      preferred_payment_method:f.preferred_payment_method,
      enrollment_fee: enrollmentFee, enrollment_fee_paid:false,
      privacy_consent:true, privacy_consent_at: new Date().toISOString(),
      conditions_accepted:true, conditions_signature:f.conditions_signature.trim(), conditions_accepted_at: new Date().toISOString()
    }).eq("id", uid);
    setLoading(false);
    if(profileErr){ setErr("Hubo un problema guardando tu clase: "+profileErr.message+". Escríbenos y lo arreglamos."); return; }
    setStep("done");
  }

  if(groups===null) return <div className="card"><div className="loader"></div></div>;
  if(loadErr) return <div className="card"><div className="err">No se pudo cargar el horario de clases: {loadErr}</div><button className="btn-ghost" style={{marginTop:10}} onClick={onBack}>← Volver</button></div>;
  if(groups.length===0) return <div className="card"><div className="empty">Todavía no hay clases publicadas. Escríbenos y te inscribimos a mano mientras tanto.</div><button className="btn-ghost" style={{marginTop:10}} onClick={onBack}>← Volver</button></div>;

  if(step==="done"){
    return (
      <div className="card" style={{textAlign:"center"}}>
        <div style={{fontSize:40}}>🎉</div>
        <h2 style={{color:"var(--azul-oscuro)"}}>¡Ya formas parte de CANVAS!</h2>
        <p style={{color:"var(--gris)"}}>Ya puedes entrar con tu email y la contraseña que has elegido.</p>
        {emailDebug && (
          <p style={{fontSize:11,color:emailDebug.ok?"var(--verde)":"var(--rojo)",background:"var(--fondo)",padding:8,borderRadius:8}}>
            {emailDebug.ok ? "✅ Email de bienvenida enviado correctamente." : `⚠️ Email no enviado: ${emailDebug.reason}`}
          </p>
        )}
        <button className="btn-primary" style={{width:"100%",marginTop:10}} onClick={()=>window.location.reload()}>Ir a mi perfil</button>
      </div>
    );
  }

  if(step==="account"){
    return (
      <div className="card">
        {isAugustNow &&
          <div style={{background:"var(--mostaza)",color:"#fff",borderRadius:12,padding:"10px 14px",marginBottom:14,fontWeight:700,textAlign:"center"}}>
            🎨 ¿Te inscribes en agosto? ¡Te regalamos la matrícula!
          </div>
        }
        <h2 style={{marginTop:0,color:"var(--azul-oscuro)"}}>Paso 1 · Crea tu cuenta</h2>
        <form onSubmit={submitAccount}>
          <Field label="Nombre completo del alumno/a"><input required value={f.display_name} onChange={e=>upd("display_name",e.target.value)}/></Field>
          <Field label="Email (será tu usuario de acceso)"><input type="email" required value={f.email} onChange={e=>upd("email",e.target.value)}/></Field>
          <div className="row">
            <div className="col"><Field label="Elige una contraseña"><input type="password" required minLength={6} value={f.password} onChange={e=>upd("password",e.target.value)}/></Field></div>
            <div className="col"><Field label="Repite la contraseña"><input type="password" required value={f.password2} onChange={e=>upd("password2",e.target.value)}/></Field></div>
          </div>
          <Field label="Fecha de nacimiento"><DateInputES value={f.birthdate} onChange={v=>upd("birthdate",v)}/></Field>
          {err && <div className="err">{err}</div>}
          <button className="btn-primary" style={{width:"100%"}} disabled={loading}>{loading?"Creando cuenta…":"Siguiente →"}</button>
        </form>
        <div style={{textAlign:"center",marginTop:14,fontSize:14}}>
          <a href="#" onClick={e=>{e.preventDefault();onBack();}}>← Volver al acceso</a>
        </div>
      </div>
    );
  }

  // step === "details"
  return (
    <div className="card">
      <h2 style={{marginTop:0,color:"var(--azul-oscuro)"}}>Paso 2 · Tu clase y tus datos</h2>
      <p style={{fontSize:13,color:"var(--gris)",marginTop:-8}}>¡Cuenta creada, {f.display_name.split(" ")[0]}! Ahora elige tu clase.</p>
      <form onSubmit={submitDetails}>
        <Field label="Elige tu clase (toca sobre el horario)">
          <WeeklyTimetable groups={groups} profiles={[]} onSelect={g=>upd("group_id",g.id)} selectedId={f.group_id}/>
          {!f.group_id && <div style={{fontSize:12,color:"var(--gris)",marginTop:6}}>Toca una clase del horario de arriba para seleccionarla.</div>}
          {f.group_id && (()=>{const g=groups.find(gg=>String(gg.id)===String(f.group_id)); return g && <div className="ok" style={{marginTop:6}}>Has elegido: {g.name} · {DNF[g.day-1]} {g.time_start}-{g.time_end} · {g.teacher}</div>;})()}
        </Field>
        {isMinor ? (
          <>
            <Field label="Nombre del adulto responsable"><input required value={f.guardian_name} onChange={e=>upd("guardian_name",e.target.value)}/></Field>
            <div className="row">
              <div className="col"><Field label="Teléfono de contacto del adulto"><input required value={f.guardian_phone} onChange={e=>upd("guardian_phone",e.target.value)}/></Field></div>
              <div className="col"><Field label="Email de contacto (opcional)"><input type="email" value={f.guardian_email} onChange={e=>upd("guardian_email",e.target.value)}/></Field></div>
            </div>
          </>
        ) : (
          <div className="row">
            <div className="col"><Field label="Tu teléfono de contacto"><input required value={f.guardian_phone} onChange={e=>upd("guardian_phone",e.target.value)}/></Field></div>
            <div className="col"><Field label="Email de contacto (opcional)"><input type="email" value={f.guardian_email} onChange={e=>upd("guardian_email",e.target.value)}/></Field></div>
          </div>
        )}
        <Field label="Forma de pago">
          <select value={f.preferred_payment_method} onChange={e=>upd("preferred_payment_method",e.target.value)}>
            <option value="transferencia">Transferencia</option>
            <option value="efectivo">Efectivo</option>
          </select>

        <Field label="¿Cómo prefieres pagar la cuota?">

              : <>He leído y acepto que mis datos (nombre completo, fecha de nacimiento y contacto) se recogen con mi consentimiento y se usan exclusivamente para la gestión académica de CANVAS: organización de clases, control de asistencia y facturación. La fecha de nacimiento se usa también para felicitarme en mi cumpleaños dentro de la app. No se cederán a terceros. Puedo solicitar la modificación o eliminación de estos datos escribiendo a <b>canvas.vall@gmail.com</b>.</>

function App(){
  const [session,setSession] = useState(undefined);
  const [profile,setProfile] = useState(null);
  const [loading,setLoading] = useState(true);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_evt,sess)=>setSession(sess));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(session===undefined) return;
    if(!session){ setProfile(null); setLoading(false); return; }
    setLoading(true);
    sb.from("profiles").select("*").eq("id",session.user.id).single().then(({data,error})=>{
      setProfile(error? null : {...data, email:session.user.email});
      setLoading(false);
    });
  },[session]);

  const logout = ()=>sb.auth.signOut();

  if(session===undefined || loading) return <LoadingScreen/>;
  if(!session || !profile) return <LoginScreen/>;
  if(profile.role==="ceo") return <CEOApp profile={profile} onLogout={logout}/>;
  if(profile.role==="teacher") return <TeacherApp profile={profile} onLogout={logout}/>;
  return <StudentApp profile={profile} onLogout={logout}/>;
}

function MySessionsPanel({profile,groups,allGroups}){
  const [cancellations,setCancellations] = useState([]);
  const [bookings,setBookings] = useState([]);
  const [msg,setMsg] = useState("");

  const occurrences = useMemo(()=>{
    const list=[];
    (groups||[]).forEach(g=> nextOccurrences(g.day,4).forEach(date=>list.push({group:g,date,type:"regular"})));
    (bookings||[]).forEach(b=>{
      const g = (allGroups||[]).find(gg=>gg.id===b.group_id);
      if(g) list.push({group:g,date:b.session_date,type:b.booking_type}); // "recovery" | "voucher"
    });
    return list.sort((a,b)=> sessionDateTime(a.date,a.group.time_start) - sessionDateTime(b.date,b.group.time_start));
  },[groups,bookings,allGroups]);

  function load(){
    sb.from("session_cancellations").select("*").eq("student_id",profile.id).then(({data})=>setCancellations(data||[]));
    sb.from("session_bookings").select("*").eq("student_id",profile.id).is("cancelled_at",null).then(({data})=>setBookings(data||[]));
  }
  useEffect(load,[(groups||[]).map(g=>g.id).join(",")]);

  async function cancelSession(group,date){
    if(!window.confirm(`¿Seguro que quieres darte de baja de "${group.name}" el ${date}? Podrás recuperarla en otro hueco.`)) return;
    setMsg("");
    const {error} = await sb.from("session_cancellations").insert({student_id:profile.id, group_id:group.id, session_date:date});
    if(error) setMsg(error.message);
    else { setMsg("Te has dado de baja de esa clase. Ya tienes derecho a recuperarla."); load(); }
  }

  if(!groups || groups.length===0) return null;
  return (
    <div className="card" style={{marginBottom:14}}>
      <h3 style={{marginTop:0}}>Mis próximas clases</h3>
      {occurrences.map(({group,date,type})=>{
        const cancelled = type==="regular" && cancellations.some(c=>c.session_date===date && c.group_id===group.id);
        const hrs = hoursUntil(date, group.time_start);
        const canCancel = type==="regular" && !cancelled && hrs>=5;
        return (
          <div key={group.id+"::"+date+"::"+type} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #EEF2F8"}}>
            <span>
              {group.name} · {date} · {group.time_start}-{group.time_end}
              {cancelled && <span className="badge badge-warn" style={{marginLeft:8}}>Baja registrada</span>}
              {type==="recovery" && <span className="badge badge-ok" style={{marginLeft:8}}>Clase de recuperación</span>}
              {type==="voucher" && <span className="badge badge-ok" style={{marginLeft:8}}>Bono canjeado</span>}
            </span>
            {type==="regular" && !cancelled && (
              <button className="btn-ghost" disabled={!canCancel} onClick={()=>cancelSession(group,date)} title={!canCancel?"Ya quedan menos de 5 horas":""}>
                Darme de baja
              </button>
            )}
          </div>
        );
      })}
      {msg && <p className="ok">{msg}</p>}
    </div>
  );
}

function RecoveryBookingPanel({profile,groups,myGroupIds}){
  const [cancellations,setCancellations] = useState([]);
  const [bookings,setBookings] = useState([]);
  const [allCancellations,setAllCancellations] = useState([]); // de todo el mundo, para calcular huecos reales
  const [allBookings,setAllBookings] = useState([]);
  const [voucherCode,setVoucherCode] = useState("");
  const [msg,setMsg] = useState("");
  const [weekOffset,setWeekOffset] = useState(0);

  function load(){
    sb.from("session_cancellations").select("*").eq("student_id",profile.id).then(({data})=>setCancellations(data||[]));
    sb.from("session_bookings").select("*").eq("student_id",profile.id).is("cancelled_at",null).then(({data})=>setBookings(data||[]));
    sb.from("session_cancellations").select("*").then(({data})=>setAllCancellations(data||[]));
    sb.from("session_bookings").select("*").is("cancelled_at",null).then(({data})=>setAllBookings(data||[]));
  }
  useEffect(load,[]);

  // Créditos: se cuentan por el MES DE LA CLASE cancelada (no por el mes de hoy — si cancelas
  // una clase de septiembre, el crédito es "de septiembre", da igual en qué mes estemos ahora).
  function creditsForMonth(y,m){
    const cancels = cancellations.filter(c=>{const d=new Date(c.session_date+"T00:00:00");return d.getFullYear()===y&&d.getMonth()+1===m;}).length;
    const recs = bookings.filter(b=>{
      if(b.booking_type!=="recovery") return false;
      const d = new Date(b.session_date+"T00:00:00");
      return d.getFullYear()===y && d.getMonth()+1===m;
    }).length;
    return Math.max(0, cancels-recs);
  }
  const totalCredits = useMemo(()=>{
    const months = new Set(cancellations.map(c=>c.session_date.slice(0,7)));
    let total=0;
    months.forEach(ym=>{ const [y,m]=ym.split("-").map(Number); total += creditsForMonth(y,m); });
    return total;
  },[cancellations,bookings]);

  // Huecos reales de una sesión concreta: aforo de la clase - matriculados + bajas ese día - reservas ya hechas ese día
  function spotsFor(g, date){
    const cancelsThatDay = allCancellations.filter(c=>c.group_id===g.id && c.session_date===date).length;
    const bookingsThatDay = allBookings.filter(b=>b.group_id===g.id && b.session_date===date).length;
    return capOf(g) - (g.current_count||0) + cancelsThatDay - bookingsThatDay;
  }

  // Semana Lunes-Viernes que corresponde al weekOffset (0 = esta semana o el inicio de curso si aún no ha empezado)
  const weekDates = useMemo(()=>{
    const base = todayISO < COURSE_START ? new Date(COURSE_START+"T00:00:00") : new Date(NOW);
    base.setHours(0,0,0,0);
    const dow = ((base.getDay()+6)%7); // 0=lunes
    const monday = new Date(base); monday.setDate(base.getDate() - dow + weekOffset*7);
    return Array.from({length:5},(_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return toLocalISO(d); });
  },[weekOffset]);

  const sessionsByDate = useMemo(()=>{
    const m = {};
    weekDates.forEach((date,i)=>{
      const dow = i+1; // 1=lunes..5=viernes
      if(!isSchoolDay(date)) return;
      groups.forEach(g=>{
        if((myGroupIds||[]).includes(g.id)) return;
        if(g.day!==dow) return;
        if(hoursUntil(date,g.time_start)<3) return;
        if(spotsFor(g,date)<=0) return;
        (m[date]=m[date]||[]).push(g);
      });
    });
    return m;
  },[weekDates,groups,allCancellations,allBookings,myGroupIds]);

  const [selected,setSelected] = useState("");
  const selectedInfo = useMemo(()=>{
    if(!selected) return null;
    const [gid,date] = selected.split("::");
    const g = groups.find(gg=>String(gg.id)===gid);
    return g ? {group:g,date} : null;
  },[selected,groups]);
  const creditsForSelectedMonth = selectedInfo ? (()=>{ const d=new Date(selectedInfo.date+"T00:00:00"); return creditsForMonth(d.getFullYear(),d.getMonth()+1); })() : 0;

  async function bookRecovery(){
    setMsg("");
    if(!selectedInfo){ setMsg("Elige una sesión del calendario."); return; }
    const {error} = await sb.from("session_bookings").insert({student_id:profile.id, group_id:selectedInfo.group.id, session_date:selectedInfo.date, booking_type:"recovery"});
    if(error) setMsg("❌ "+error.message);
    else { setMsg(`✅ ¡Reservado! Tu clase de recuperación en "${selectedInfo.group.name}" el ${selectedInfo.date} ya aparece en "Mis próximas clases".`); setSelected(""); load(); }
  }

  async function redeemVoucher(){
    setMsg("");
    if(!selectedInfo){ setMsg("Elige una sesión del calendario."); return; }
    const {data:v} = await sb.from("gift_vouchers").select("*").eq("code",voucherCode.trim()).eq("paid",true).eq("redeemed",false).maybeSingle();
    if(!v){ setMsg("Ese código de bono no es válido o ya se ha canjeado."); return; }
    const {error} = await sb.from("session_bookings").insert({student_id:profile.id, group_id:selectedInfo.group.id, session_date:selectedInfo.date, booking_type:"voucher", voucher_id:v.id});
    if(error){ setMsg(error.message); return; }
    await sb.from("gift_vouchers").update({redeemed:true, redeemed_by:profile.display_name, redeemed_at:todayISO}).eq("id",v.id);
    setMsg("¡Bono canjeado y clase reservada!"); setVoucherCode(""); load();
  }

  const firstDate = new Date(weekDates[0]+"T00:00:00");
  const lastDate = new Date(weekDates[4]+"T00:00:00");

  return (
    <div className="card" style={{marginBottom:14}}>
      <h3 style={{marginTop:0}}>Recuperar una clase o canjear un bono</h3>
      <p style={{fontSize:13,color:"var(--gris)"}}>Créditos de recuperación disponibles: <b>{totalCredits}</b>. Puedes reservar hasta 3 horas antes de la sesión.</p>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <button className="btn-ghost" style={{padding:"6px 12px"}} onClick={()=>setWeekOffset(w=>Math.max(0,w-1))} disabled={weekOffset===0}>← Semana anterior</button>
        <div style={{fontWeight:700,color:"var(--azul-oscuro)",fontSize:13}}>
          {firstDate.getDate()}/{firstDate.getMonth()+1} – {lastDate.getDate()}/{lastDate.getMonth()+1}
        </div>
        <button className="btn-ghost" style={{padding:"6px 12px"}} onClick={()=>setWeekOffset(w=>w+1)}>Semana siguiente →</button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8}}>
        {weekDates.map((date,i)=>{
          const d = new Date(date+"T00:00:00");
          const closed = !isSchoolDay(date);
          const sessionsThatDay = sessionsByDate[date]||[];
          return (
            <div key={date}>
              <div style={{textAlign:"center",fontWeight:700,fontSize:12,color:"var(--azul-oscuro)",marginBottom:6,borderBottom:"2px solid var(--azul-claro)",paddingBottom:4}}>
                {DNF[i]}<br/>{d.getDate()}/{d.getMonth()+1}
              </div>
              {closed && <div style={{fontSize:11,color:"var(--gris)",textAlign:"center"}}>Sin clase</div>}
              {!closed && sessionsThatDay.length===0 && <div style={{fontSize:11,color:"var(--gris)",textAlign:"center"}}>—</div>}
              {sessionsThatDay.map(g=>{
                const key = g.id+"::"+date;
                const sel = selected===key;
                const spots = spotsFor(g,date);
                return (
                  <div key={key} onClick={()=>setSelected(key)} style={{
                    cursor:"pointer", marginBottom:6, borderRadius:10, padding:"6px 8px",
                    background: sel?"#FFF3D6":"#fff",
                    border:`2px solid ${sel?"var(--mostaza)":classColor(g.name)}`,
                    boxShadow: sel?"0 0 0 3px rgba(233,168,0,0.25)":"none"
                  }}>
                    <div style={{fontWeight:700,fontSize:12}}>{g.name}</div>
                    <div style={{fontSize:11,color:classColor(g.name)}}>{g.teacher} · {g.time_start}</div>
                    <div style={{fontSize:11,color:"var(--gris)"}}>{spots} hueco{spots!==1?"s":""}</div>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>

      <div className="row" style={{marginTop:10}}>
        <button className="btn-secondary" disabled={creditsForSelectedMonth<=0 || !selectedInfo} onClick={bookRecovery}>Reservar como recuperación</button>
      </div>
      {selectedInfo && creditsForSelectedMonth<=0 && <p style={{fontSize:12,color:"var(--rojo)"}}>No te queda ningún crédito de recuperación para el mes de esa sesión.</p>}
      <Field label="Código de bono regalo">
        <div className="row" style={{gap:8}}>
          <input style={{flex:1}} value={voucherCode} onChange={e=>setVoucherCode(e.target.value)} placeholder="CANVAS-1234"/>
          <button className="btn-primary" disabled={!selectedInfo} onClick={redeemVoucher}>Canjear y reservar</button>
        </div>
      </Field>
      {msg && <div style={{marginTop:10,padding:"10px 12px",borderRadius:10,fontSize:13,fontWeight:600,background: msg.startsWith("❌")?"#FCE7E7":"#E4F7EC",color: msg.startsWith("❌")?"var(--rojo)":"var(--verde)"}}>{msg}</div>}
    </div>
  );
}

function CalendarInfoBanner(){
  const inCourse = todayISO>=COURSE_START && todayISO<=COURSE_END;
  const closureToday = SCHOOL_CLOSURES.find(c=>todayISO>=c.start && todayISO<=c.end);
  const upcoming = nextClosure(todayISO);
  let msg;
  if(!inCourse && todayISO<COURSE_START){
    const d = new Date(COURSE_START+"T00:00:00");
    msg = `Las clases del nuevo curso empiezan el ${d.getDate()} de ${MN[d.getMonth()+1]} de ${d.getFullYear()}, siguiendo el calendario escolar de Castilla y León.`;
  } else if(closureToday){
    msg = `Hoy no hay clase: ${closureToday.label}.`;
  } else if(upcoming){
    const d = new Date(upcoming.start+"T00:00:00");
    msg = `Próximo día sin clase: ${d.getDate()} de ${MN[d.getMonth()+1]} — ${upcoming.label}.`;
  } else {
    msg = "La academia sigue el calendario escolar oficial de Castilla y León.";
  }
  return <div className="card" style={{marginBottom:14,fontSize:13,color:"var(--gris)",borderLeft:"4px solid var(--azul-claro)"}}>📅 {msg}</div>;
}

function StudentApp({profile,onLogout}){
  const [tab,setTab] = useState("clase");
  const [group,setGroup] = useState(null);
  const [allGroups,setAllGroups] = useState([]);
  const [extraGroupIds,setExtraGroupIds] = useState([]); // ids de student_groups (para poder borrar)
  const [extraGroups,setExtraGroups] = useState([]); // los grupos completos
  const [payments,setPayments] = useState([]);
  const [file,setFile] = useState(null);
  const [msg,setMsg] = useState("");
  const [addingClass,setAddingClass] = useState(false);
  const [newGroupChoice,setNewGroupChoice] = useState(null);
  const [addMsg,setAddMsg] = useState("");

  function loadExtra(all){
    sb.from("student_groups").select("*").eq("student_id",profile.id).then(({data})=>{
      const rows = data||[];
      setExtraGroupIds(rows);
      setExtraGroups(rows.map(r=>all.find(g=>g.id===r.group_id)).filter(Boolean));
    });
  }

  useEffect(()=>{
    if(profile.group_id) sb.from("groups").select("*").eq("id",profile.group_id).single().then(({data})=>setGroup(data));
    sb.from("groups").select("*").then(({data})=>{ const all=data||[]; setAllGroups(all); loadExtra(all); });
    sb.from("payments").select("*").eq("student_id",profile.id).order("year",{ascending:false}).order("month",{ascending:false}).then(({data})=>setPayments(data||[]));
  },[]);

  const duePaymentYear = todayISO < COURSE_START ? parseInt(COURSE_START.slice(0,4)) : CY;
  const duePaymentMonth = todayISO < COURSE_START ? parseInt(COURSE_START.slice(5,7)) : CM;
  const thisMonthPayment = payments.find(p=>p.year===duePaymentYear && p.month===duePaymentMonth);
  const myGroupIds = [profile.group_id, ...extraGroups.map(g=>g.id)].filter(Boolean);
  const monthlyFee = computeTotalFee([profile.fee, ...extraGroups.map(g=>g.fee)]);
  const planType = profile.payment_type || "monthly";
  const totalFee = planType==="monthly" ? monthlyFee : computePlanTotal(monthlyFee, planType);
  const planMonths = PLAN_MONTHS[planType]||1;
  const hasDiscount = (1+extraGroups.length)>=2;

  async function addClass(g){
    setAddMsg("");
    const {error} = await sb.from("student_groups").insert({student_id:profile.id, group_id:g.id});
    if(error){ setAddMsg(error.message); return; }
    setAddMsg("¡Clase añadida!");
    sb.from("groups").select("*").then(({data})=>{ const all=data||[]; setAllGroups(all); loadExtra(all); });
  }
  async function confirmAddClass(){
    if(!newGroupChoice) return;
    setAddMsg("");
    if(!group){
      // Es su primera clase: se guarda como clase PRINCIPAL del perfil, no como extra
      const {error} = await sb.from("profiles").update({group_id:newGroupChoice.id, fee:newGroupChoice.fee}).eq("id",profile.id);
      if(error){ setAddMsg(error.message); return; }
      setGroup(newGroupChoice);
      sb.from("groups").select("*").then(({data})=>{ const all=data||[]; setAllGroups(all); loadExtra(all); });
    } else {
      await addClass(newGroupChoice);
    }
    setAddingClass(false); setNewGroupChoice(null);
  }
  async function removeClass(row,groupName){
    if(!window.confirm(`¿Seguro que quieres darte de baja de "${groupName}"? Perderás tu plaza en esa clase.`)) return;
    await sb.from("student_groups").delete().eq("id",row.id);
    sb.from("groups").select("*").then(({data})=>{ const all=data||[]; setAllGroups(all); loadExtra(all); });
  }

  async function upload(){
    if(!file){ setMsg("Elige un archivo primero."); return; }
    setMsg("Subiendo…");
    const path = `${profile.id}/${duePaymentYear}-${duePaymentMonth}-${Date.now()}-${file.name}`;
    const { error: upErr } = await sb.storage.from("receipts").upload(path, file);
    if(upErr){ setMsg("Error al subir: "+upErr.message); return; }
    const months = monthsCoveredFrom(duePaymentYear, duePaymentMonth, planMonths);
    const rows = months.map((m,i)=>({
      student_id:profile.id, year:m.year, month:m.month, status:"uploaded",
      filename:file.name, file_path:path, amount: i===0?totalFee:0, upload_date:todayISO
    }));
    const { error: payErr } = await sb.from("payments").upsert(rows, {onConflict:"student_id,year,month"});
    if(payErr){ setMsg("Error guardando el pago: "+payErr.message); return; }
    setMsg(planMonths>1 ? `¡Justificante subido! Cubre ${planMonths} meses — en cuanto lo validemos, los verás todos actualizados.` : "¡Justificante subido! En cuanto lo validemos verás el estado actualizado.");
    sb.from("payments").select("*").eq("student_id",profile.id).order("year",{ascending:false}).then(({data})=>setPayments(data||[]));
  }

  return (
    <div>
      <div className="topbar"><Logo size={30} dark={true}/><button className="btn-ghost" onClick={onLogout}>Salir</button></div>
      <div className="container">
        {isBirthday(profile.birthdate) && <BirthdayBanner name={profile.display_name}/>}
        <h2 style={{color:"var(--azul-oscuro)",marginBottom:10}}>¡Hola, {profile.display_name.split(" ")[0]}! 👋</h2>
        {myGroupIds.length>0 && <CalendarInfoBanner/>}

        <div className="tabs" style={{marginBottom:14}}>
          <div className={"tab "+(tab==="clase"?"active":"")} onClick={()=>setTab("clase")}>Mi clase</div>
          <div className={"tab "+(tab==="pagos"?"active":"")} onClick={()=>setTab("pagos")}>Pagos</div>
          {myGroupIds.length>0 && <div className={"tab "+(tab==="recuperar"?"active":"")} onClick={()=>setTab("recuperar")}>Recuperaciones</div>}
          {myGroupIds.length>0 && <div className={"tab "+(tab==="avisos"?"active":"")} onClick={()=>setTab("avisos")}>Avisos</div>}
        </div>

        {tab==="clase" && (
        <div className="card" style={{marginBottom:14}}>
          {group ? (
            <p>Tu clase: <b>{group.name}</b> — {DNF[group.day-1]} {group.time_start}-{group.time_end} con <b style={{color:classColor(group.name)}}>{group.teacher}</b></p>

function SessionModal({group, date, profiles, extraEnrollments, onClose}){
  const roster = effectiveRoster(group, profiles, extraEnrollments);
  const [status,setStatus] = useState({});
  const [cash,setCash] = useState({});
  const [saving,setSaving] = useState(false);

  function studentProfileFor(name){ return (profiles||[]).find(p=>p.display_name===name) || null; }

  useEffect(()=>{
    sb.from("attendance").select("*").eq("group_id",group.id).eq("session_date",date).then(({data})=>{
      const s={}; (data||[]).forEach(r=>s[r.student_name]=r.status); setStatus(s);
    });
  },[]);

  async function save(){
    setSaving(true);
    const rows = roster.map(name=>({group_id:group.id, session_date:date, student_name:name, status:status[name]||"pr"}));
    const {error} = await sb.from("attendance").upsert(rows,{onConflict:"group_id,session_date,student_name"});

    const cashNames = roster.filter(name=>cash[name]);
    for(const name of cashNames){
      const p = studentProfileFor(name);
      if(!p) continue; // alumnos sin cuenta en la app no se pueden marcar (no tienen ficha de pagos)
      await sb.from("payments").upsert({
        student_id:p.id, year:CY, month:CM, status:"validated",
        amount:p.fee, validated_date:todayISO, upload_date:todayISO
      }, {onConflict:"student_id,year,month"});
    }

    setSaving(false);
    if(!error) onClose();
  }

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3 style={{marginTop:0}}>{group.name} — {date}</h3>
        <p style={{fontSize:12,color:"var(--gris)",marginTop:-8}}>✓ Asistió · ↩ Recuperable · ✗ No asistió · 💶 Pagó en efectivo hoy</p>
        {roster.length===0 && <div className="empty">No hay alumnos en esta clase todavía.</div>}
        {roster.map(name=>{
          const p = studentProfileFor(name);
          return (
          <div key={name} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #EEF2F8"}}>
            <span>{name}</span>
            <div className="row" style={{gap:6}}>
              <button style={{padding:"6px 10px",background:status[name]==="pr"||!status[name]?"var(--verde)":"#eee",color:status[name]==="pr"||!status[name]?"#fff":"#999"}} onClick={()=>setStatus(s=>({...s,[name]:"pr"}))}>✓</button>
              <button style={{padding:"6px 10px",background:status[name]==="ar"?"var(--mostaza)":"#eee",color:status[name]==="ar"?"#fff":"#999"}} onClick={()=>setStatus(s=>({...s,[name]:"ar"}))}>↩</button>
              <button style={{padding:"6px 10px",background:status[name]==="ab"?"var(--rojo)":"#eee",color:status[name]==="ab"?"#fff":"#999"}} onClick={()=>setStatus(s=>({...s,[name]:"ab"}))}>✗</button>
              <button disabled={!p} title={!p?"Este alumno no tiene cuenta en la app":""} style={{padding:"6px 10px",background:cash[name]?"var(--azul-oscuro)":"#eee",color:cash[name]?"#fff":"#999",opacity:p?1:0.4}} onClick={()=>setCash(c=>({...c,[name]:!c[name]}))}>💶</button>
            </div>
          </div>
        );})}
        <div className="row" style={{marginTop:16}}>
          <button className="btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn-primary" onClick={save} disabled={saving}>{saving?"Guardando…":"Guardar asistencia"}</button>
        </div>
      </div>
    </div>
  );
}

function CEODashboard({groups,profiles,payments,expenses,extraEnrollments}){
  const students = profiles.filter(p=>p.role==="student");
  const totalStudents = groups.reduce((s,g)=>s+effectiveRoster(g,profiles,extraEnrollments).length,0);
  const occupancy = groups.length? Math.round(100*groups.reduce((s,g)=>s+Math.min(effectiveRoster(g,profiles,extraEnrollments).length,capOf(g)),0)/groups.reduce((s,g)=>s+capOf(g),0)) : 0;
  const validated = payments.filter(p=>p.year===CY&&p.month===CM&&p.status==="validated").reduce((s,p)=>s+(p.amount||0),0);
  const pendingCount = students.filter(s=>!payments.some(p=>p.student_id===s.id&&p.year===CY&&p.month===CM&&p.status!=="pending")).length;
  const monthExpenses = expenses.filter(e=>e.year===CY&&e.month===CM).reduce((s,e)=>s+e.amount,0);
  const birthdaysToday = students.filter(p=>isBirthday(p.birthdate));
  const lowOccupancy = groups.filter(g=>effectiveRoster(g,profiles,extraEnrollments).length<3);

  return (
    <div>
      <CalendarInfoBanner/>
      {birthdaysToday.length>0 && (
        <div className="card" style={{marginBottom:14,borderLeft:"4px solid var(--mostaza)"}}>
          {birthdaysToday.map(b=><div key={b.id}>🎂 ¡Hoy es el cumpleaños de <b>{b.display_name}</b> ({ageFromBirthdate(b.birthdate)} años)!</div>)}
        </div>
      )}
      <div className="row">
        <div className="col card"><div style={{fontSize:26,fontWeight:800}}>{totalStudents}</div><div style={{color:"var(--gris)"}}>Alumnos totales</div></div>
        <div className="col card"><div style={{fontSize:26,fontWeight:800}}>{occupancy}%</div><div style={{color:"var(--gris)"}}>Ocupación</div></div>
        <div className="col card"><div style={{fontSize:26,fontWeight:800,color:"var(--verde)"}}>{validated}€</div><div style={{color:"var(--gris)"}}>Ingresos validados ({MN[CM]})</div></div>
        <div className="col card"><div style={{fontSize:26,fontWeight:800,color:"var(--rojo)"}}>{monthExpenses}€</div><div style={{color:"var(--gris)"}}>Gastos ({MN[CM]})</div></div>
      </div>
      <div className="card" style={{marginTop:14}}>
        <h3 style={{marginTop:0}}>Alertas</h3>
        {pendingCount>0 && <div className="badge badge-warn" style={{marginRight:8,marginBottom:6}}>{pendingCount} alumnos sin pago este mes</div>}
        {lowOccupancy.length>0 && <div className="badge badge-bad" style={{marginBottom:6}}>{lowOccupancy.length} clases con baja ocupación</div>}
        {pendingCount===0 && lowOccupancy.length===0 && <div style={{color:"var(--verde)"}}>Todo en orden ✓</div>}
      </div>
    </div>
  );
}

function StudentsDirectoryView({groups,profiles,extraEnrollments}){
  const sortedGroups = [...groups].sort((a,b)=> a.day-b.day || a.time_start.localeCompare(b.time_start));
  function studentsOf(g){
    const names = effectiveRoster(g,profiles,extraEnrollments);
    return names.map(name=>{
      const p = profiles.find(pp=>pp.display_name===name);
      return {name, p};
    });
  }
  return (
    <div>
      {sortedGroups.map(g=>{
        const students = studentsOf(g);
        if(students.length===0) return null;
        return (
          <div key={g.id} className="card" style={{marginBottom:12,borderLeft:`4px solid ${classColor(g.name)}`}}>
            <div style={{fontWeight:800,color:"var(--azul-oscuro)",marginBottom:8}}>
              {DNF[g.day-1]} {g.time_start}-{g.time_end} · {g.name} · {g.teacher} ({students.length}/{capOf(g)})
            </div>
            <table>
              <thead><tr><th>Alumno/a</th><th>Edad</th><th>Teléfono</th><th>Email</th></tr></thead>
              <tbody>
                {students.map(({name,p})=>(
                  <tr key={name}>
                    <td>{name}</td>
                    <td>{p?.birthdate ? ageFromBirthdate(p.birthdate) : "—"}</td>
                    <td>{p?.guardian_phone || "—"}</td>
                    <td>{p?.email || p?.guardian_email || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      })}
      {sortedGroups.every(g=>studentsOf(g).length===0) && <div className="empty">Todavía no hay alumnos inscritos en ninguna clase.</div>}
    </div>
  );
}

function PaymentsView({profiles,payments,reload}){
  const [year,setYear] = useState(todayISO<COURSE_START ? parseInt(COURSE_START.slice(0,4)) : CY);
  const [month,setMonth] = useState(todayISO<COURSE_START ? parseInt(COURSE_START.slice(5,7)) : CM);
  const students = profiles.filter(p=>p.role==="student");
  async function validate(studentId, filePath){
    let q = sb.from("payments").update({status:"validated",validated_date:todayISO}).eq("student_id",studentId);
    q = filePath ? q.eq("file_path",filePath) : q.eq("year",year).eq("month",month);
    await q;
    reload();
  }
  async function view(path){
    const {data} = await sb.storage.from("receipts").createSignedUrl(path,3600);
    if(data) window.open(data.signedUrl,"_blank");
  }
  return (
    <div>
      <div className="row" style={{marginBottom:10,alignItems:"flex-end"}}>
        <div className="col"><Field label="Mes"><select value={month} onChange={e=>setMonth(parseInt(e.target.value))}>{MN.slice(1).map((m,i)=><option key={m} value={i+1}>{m}</option>)}</select></Field></div>
        <div className="col"><Field label="Año"><select value={year} onChange={e=>setYear(parseInt(e.target.value))}>{[CY-1,CY,CY+1].map(y=><option key={y} value={y}>{y}</option>)}</select></Field></div>
      </div>
      <table><thead><tr><th>Alumno</th><th>Cuota</th><th>Plan</th><th>Estado</th><th>Justificante</th><th></th></tr></thead>
      <tbody>
        {students.map(s=>{
          const p = payments.find(pp=>pp.student_id===s.id&&pp.year===year&&pp.month===month);
          const planLabel = {monthly:"Mensual",quarterly:"Trimestral",annual:"Curso completo"}[s.payment_type]||"Mensual";
          return <tr key={s.id}>
            <td>{s.display_name}</td><td>{s.fee}€</td><td>{planLabel}</td>
            <td>{p?.status==="validated"?<span className="badge badge-ok">Validado</span>:p?.status==="uploaded"?<span className="badge badge-warn">Subido</span>:<span className="badge badge-bad">Pendiente</span>}</td>
            <td>{p?.file_path && <a href="#" onClick={e=>{e.preventDefault();view(p.file_path);}}>Ver</a>}</td>
            <td>{p?.status==="uploaded" && <button className="btn-secondary" onClick={()=>validate(s.id,p.file_path)}>Validar{s.payment_type!=="monthly"?" (todos los meses)":""}</button>}</td>
          </tr>;
        })}
      </tbody></table>
    </div>
  );
}

/* ============================================================

function StatsView({groups,profiles,attendance,extraEnrollments}){
  const roster = [];
  groups.forEach(g=>effectiveRoster(g,profiles,extraEnrollments).forEach(name=>roster.push({name,group:g.name})));
  function counts(name){
    const rows = attendance.filter(a=>a.student_name===name);
    return { pr: rows.filter(r=>r.status==="pr").length, ar: rows.filter(r=>r.status==="ar").length, ab: rows.filter(r=>r.status==="ab").length };
  }
  return (
    <table><thead><tr><th>Alumno</th><th>Clase</th><th>Presencias</th><th>Recup.</th><th>Ausencias</th></tr></thead>
    <tbody>{roster.map((r,i)=>{const c=counts(r.name);const total=c.pr+c.ar+c.ab;return <tr key={i}><td>{r.name}</td><td>{r.group}</td><td>{c.pr}</td><td>{c.ar}</td><td>{c.ab}{total>0 && ` (${Math.round(100*c.pr/total)}%)`}</td></tr>;})}</tbody></table>
  );
}

/* ============================================================
   VISTA CEO — PAGO A PROFESORAS (horas + incentivo)
   ============================================================ */
function hoursOfGroup(g){
  const [h1,m1]=g.time_start.split(":").map(Number), [h2,m2]=g.time_end.split(":").map(Number);
  return ((h2*60+m2)-(h1*60+m1))/60;
}
function tierBonusFor(n,tiers){
  const t = tiers.find(t=>n>=t.min_students && n<=t.max_students);
  return t? t.bonus_per_hour : 0;
}
// Calcula, para un año/mes concreto, las sesiones con asistencia y el total a pagar por profesora
function computeTeacherPay(year,month,{groups,attendance,rates,tiers}){
  const seen = {};
  attendance.forEach(a=>{
    const d = new Date(a.session_date+"T00:00:00");
    if(d.getFullYear()!==year || d.getMonth()+1!==month) return;
    seen[a.group_id+"::"+a.session_date] = true;
  });
  const sessions = Object.keys(seen).map(k=>{ const [gid,date]=k.split("::"); return {gid:parseInt(gid),date}; });
  const byTeacher = {};
  sessions.forEach(s=>{
    const g = groups.find(gg=>gg.id===s.gid); if(!g) return;
    const hours = hoursOfGroup(g);
    const rate = rates.find(r=>r.teacher_name===g.teacher)?.rate_per_hour || 0;
    const bonus = tierBonusFor(g.current_count||0,tiers);
    byTeacher[g.teacher] = byTeacher[g.teacher] || {hours:0,total:0,sessions:0};
    byTeacher[g.teacher].hours += hours;
    byTeacher[g.teacher].sessions += 1;
    byTeacher[g.teacher].total += hours*(rate+bonus);
  });
  return byTeacher;
}

function TeacherPayView({groups,attendance,rates,tiers}){
  const [year,setYear] = useState(CY);
  const [month,setMonth] = useState(CM);
  const byTeacher = useMemo(()=>computeTeacherPay(year,month,{groups,attendance,rates,tiers}),[year,month,groups,attendance,rates,tiers]);

  return (
    <div>
      <div className="row" style={{marginBottom:10,alignItems:"flex-end"}}>
        <div className="col"><Field label="Mes"><select value={month} onChange={e=>setMonth(parseInt(e.target.value))}>{MN.slice(1).map((m,i)=><option key={m} value={i+1}>{m}</option>)}</select></Field></div>
        <div className="col"><Field label="Año"><select value={year} onChange={e=>setYear(parseInt(e.target.value))}>{[CY-1,CY,CY+1].map(y=><option key={y} value={y}>{y}</option>)}</select></Field></div>
      </div>
      <p style={{fontSize:13,color:"var(--gris)"}}>Calculado a partir de las sesiones con asistencia registrada en {MN[month]} {year}. Tarifa + incentivo según nº de alumnos de cada clase.</p>
      <table><thead><tr><th>Profesora</th><th>Sesiones</th><th>Horas</th><th>Total a pagar</th></tr></thead>
      <tbody>{TEACHERS.map(t=>{const d=byTeacher[t]||{hours:0,total:0,sessions:0};return <tr key={t}><td>{t}</td><td>{d.sessions}</td><td>{d.hours.toFixed(1)}h</td><td><b>{d.total.toFixed(2)}€</b></td></tr>;})}</tbody></table>
    </div>
  );
}

    if(!concept||!amount) return;
    await sb.from("expenses").insert({concept,amount:parseFloat(amount),month:CM,year:CY});

  }
  const monthExpenses = expenses.filter(e=>e.year===CY&&e.month===CM);
  return (
    <div>
      <div className="row" style={{marginBottom:12}}>
        <div className="col"><input placeholder="Concepto" value={concept} onChange={e=>setConcept(e.target.value)}/></div>
