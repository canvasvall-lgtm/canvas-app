<style>
  :root{
    --mostaza:#E9A800; --azul-claro:#6FC2D8; --azul-oscuro:#2350A0; --fondo:#EEF5FF;
    --rojo:#E05353; --verde:#3FAE6B; --gris:#8A93A6; --texto:#1E2A3A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--texto);}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-weight:600;transition:.15s;}
  button:active{transform:scale(.97);}
  input,select,textarea{font-family:inherit;border:2px solid #D8E3F5;border-radius:10px;padding:10px 12px;font-size:15px;width:100%;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul-claro);}
  .btn-primary{background:var(--mostaza);color:#fff;}
  .btn-secondary{background:var(--azul-claro);color:#fff;}
  .btn-dark{background:var(--azul-oscuro);color:#fff;}
  .btn-ghost{background:#fff;color:var(--azul-oscuro);border:2px solid #D8E3F5;}
  .btn-danger{background:var(--rojo);color:#fff;}
  .card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(35,80,160,.08);}
  .container{max-width:1100px;margin:0 auto;padding:16px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .col{flex:1;min-width:220px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
  .badge-ok{background:#E4F7EC;color:var(--verde);}
  .badge-warn{background:#FFF3D6;color:var(--mostaza);}
  .badge-bad{background:#FCE7E7;color:var(--rojo);}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
  .tab{padding:9px 16px;border-radius:999px;background:#fff;color:var(--azul-oscuro);font-weight:600;white-space:nowrap;font-size:14px;}
  .tab.active{background:var(--azul-oscuro);color:#fff;}
  .topbar{background:var(--azul-oscuro);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
  .modal-bg{position:fixed;inset:0;background:rgba(30,42,58,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:16px;padding:20px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;}
  .table-wrap{width:100%;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:480px;}
  th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #EEF2F8;}
  th{color:var(--gris);font-size:12px;text-transform:uppercase;}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40;}
  .confetti span{position:absolute;top:-20px;font-size:22px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.3;}}
  .birthday-banner{background:linear-gradient(135deg,var(--mostaza),#F5C542);color:#fff;border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;}
  a{color:var(--azul-oscuro);}
  .loader{width:34px;height:34px;border:4px solid #D8E3F5;border-top-color:var(--azul-oscuro);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err{color:var(--rojo);font-size:14px;margin:4px 0;}
  .ok{color:var(--verde);font-size:14px;margin:4px 0;}
  .empty{text-align:center;color:var(--gris);padding:30px 10px;}
</style>

function monthsForPlan(planType, year, month) {
  const idx = SCHOOL_MONTHS.findIndex(m => m.year === year && m.month === month);
  if (idx === -1) return [{

    month
  }];
  if (planType === "monthly") return [{

    month: courseAwareM

  const a = profile.enrollment_start_year * 12 + profile.enrollment_start_month;
